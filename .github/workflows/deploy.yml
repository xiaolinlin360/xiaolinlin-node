name: 自动部署后端到腾讯云服务器

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 🚀 部署工作
    runs-on: ubuntu-latest

    steps:
      - name: 📦 读取仓库内容
        uses: actions/checkout@v4

      - name: 🔗 SSH 连接服务器并执行更新
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. 进入项目目录（注意：目录名是 xiaolinlin-node）
            cd /home/ubuntu/my-node

            # 2. 拉取最新代码
            git pull origin main

            # 3. 安装依赖
            /home/ubuntu/.npm-global/bin/pnpm install --frozen-lockfile

            # 4. 重启 PM2 进程（注意：进程名是 xiaolinlin-node）
            /home/ubuntu/.npm-global/bin/pm2 reload xiaolinlin-node || /home/ubuntu/.npm-global/bin/pm2 start blog.js --name "xiaolinlin-node"
